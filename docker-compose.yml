networks:
  agrosolutions-network:
    driver: bridge
    name: agrosolutions-network

services:
  # 🗄️ Keycloak Database
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrosolutions-network

  # 🔐 Keycloak (Identity Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - agrosolutions-network

  #  Identity API (com AWS SQS/SNS/SES real)
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "${BUILD_DATE:-2024-01-01T00:00:00Z}"
        VERSION: "${VERSION:-1.0.0}"
        REVISION: "${REVISION:-dev}"
    container_name: identity-api
    ports:
      - "5001:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # ASP.NET Core
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

      # Database (OutboxDb via keycloak-db)
      - ConnectionStrings__OutboxDb=Host=keycloak-db;Port=5432;Database=outbox;Username=keycloak;Password=password

      # JWT Configuration
      - Jwt__Authority=http://keycloak:8080/realms/agrosolutions
      - Jwt__Audience=agrosolutions-api

      # Keycloak Integration
      - KeycloakConfiguration__BaseUrl=http://keycloak:8080
      - KeycloakConfiguration__TokenEndpointPath=/realms/master/protocol/openid-connect/token
      - KeycloakConfiguration__UsersEndpointPath=/admin/realms/agrosolutions/users
      - KeycloakConfiguration__TargetRealm=agrosolutions
      - KeycloakConfiguration__Audience=http://keycloak:8080
      - KeycloakConfiguration__AdminClientId=agrosolutions-api-service-account
      - KeycloakConfiguration__AdminClientSecret=7LF1zdJRb0KppOY2LNrmokWZvnvH0nXX
      - KeycloakConfiguration__ApiClientId=agrosolutions-api
      - KeycloakConfiguration__ApiClientSecret=mev3cV6wKPvu42AItT1dDWhxjHGKHhJe

      # ☁️ AWS Configuration (recursos REAIS)
      - AWS__Region=sa-east-1
      - AWS__Profile=${AWS_PROFILE:-default}
      
      # AWS Credentials (passadas do host)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=sa-east-1

      # SQS Queues (REAIS - já criadas)
      - AWS__SQS__Queues__IdentityEvents=agrosolutions-identity-events
      - AWS__SQS__Queues__EmailQueue=agrosolutions-email-queue
      - AWS__SQS__Queues__ProdutorSyncQueue=agrosolutions-produtor-sync-queue
      - AWS__SQS__Queues__StatusChangedQueue=agrosolutions-status-changed-queue

      # SNS Topics (REAIS - já criados)
      - AWS__SNS__Topics__UserEvents=arn:aws:sns:sa-east-1:405114419969:agrosolutions-user-events
      - AWS__SNS__Topics__EmailNotifications=arn:aws:sns:sa-east-1:405114419969:agrosolutions-email-notifications
      - AWS__SNS__Topics__PropertyEvents=arn:aws:sns:sa-east-1:405114419969:agrosolutions-property-events

      # SES Configuration (REAL - já configurado)
      - AWS__SES__FromEmail=vinicius_pinheiro02@hotmail.com
      - AWS__SES__FromName=AgroSolutions
      - AWS__SES__ConfigurationSetName=agrosolutions-production
      - AWS__SES__VerifiedEmails__0=vinicius_pinheiro02@hotmail.com

    volumes:
      # Montar credenciais AWS do host (se existirem)
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - agrosolutions-network

volumes:
  keycloak_db_data:
    driver: local
