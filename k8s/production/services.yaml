---
# Identity API Service
apiVersion: v1
kind: Service
metadata:
  name: identity-api-service
  namespace: agrosolutions-identity
spec:
  selector:
    app: identity-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# Keycloak Service (NodePort para acesso externo em ambiente de demonstração)
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: agrosolutions-identity
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort

---
# Keycloak Database Service  
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db-service
  namespace: agrosolutions-identity
  labels:
    app: keycloak-db
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  selector:
    app: keycloak-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
    - name: metrics
      protocol: TCP
      port: 9187
      targetPort: 9187
  type: ClusterIP
