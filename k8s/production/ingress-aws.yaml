# ⚠️ IMPORTANTE: Acesso Principal via Ocelot API Gateway
# Este Ingress é OPCIONAL e serve apenas para:
# - Acesso direto ao Keycloak Admin Console (debug)
# - Health checks externos
# - Testes de integração
#
# O acesso PÚBLICO à API deve ser feito via Ocelot Gateway em:
# - api.agrosolutions.com/identity/* → roteado para identity-api-service.agrosolutions-identity:80
#
# Configuração do Ocelot Gateway está em: agrosolutions-api-gateway/src/AgroSolutions.ApiGateway/ocelot.json

---
# Keycloak Admin Console Ingress
# ALB compartilhado (grupo: agrosolutions-shared) - HTTP-only para demonstração
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: agrosolutions-identity
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/group.name: agrosolutions-shared
    alb.ingress.kubernetes.io/group.order: '20'
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: keycloak-admin.agrosolutions.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
