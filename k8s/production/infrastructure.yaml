# Example: Create secrets using kubectl
# kubectl create secret generic keycloak-client-secrets \
#   --from-literal=admin-client-secret=YOUR_ADMIN_SECRET \
#   --from-literal=api-client-secret=YOUR_API_SECRET \
#   -n agrosolutions-identity

# kubectl create secret generic jwt-secrets \
#   --from-literal=issuer=http://keycloak-service:8080/realms/agrosolutions \
