---
# AWS IAM Role for Service Account (IRSA) Annotation
# This allows pods to assume AWS IAM roles without explicit credentials
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agrosolutions-identity-sa
  namespace: agrosolutions-identity
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::316295889438:role/AgroSolutionsIdentityServiceRole

---
