---
# AWS IAM Role for Service Account (IRSA)
# Permite pods assumirem IAM Roles sem credenciais explícitas
# 
# Configuração:
# - ServiceAccount: agrosolutions-identity-sa
# - IAM Role: AgroSolutionsIdentityServiceRole
# - Políticas: SNS, SQS, SES (conforme necessário)
# 
# Para criar o IAM Role:
# aws iam create-role --role-name AgroSolutionsIdentityServiceRole \
#   --assume-role-policy-document file://trust-policy.json
# 
# Trust policy deve incluir o OIDC provider do EKS:
# {
#   "Effect": "Allow",
#   "Principal": {
#     "Federated": "arn:aws:iam::316295889438:oidc-provider/oidc.eks.sa-east-1.amazonaws.com/id/YOUR_OIDC_ID"
#   },
#   "Action": "sts:AssumeRoleWithWebIdentity",
#   "Condition": {
#     "StringEquals": {
#       "oidc.eks.sa-east-1.amazonaws.com/id/YOUR_OIDC_ID:sub": "system:serviceaccount:agrosolutions-identity:agrosolutions-identity-sa"
#     }
#   }
# }
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agrosolutions-identity-sa
  namespace: agrosolutions-identity
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::316295889438:role/AgroSolutionsIdentityServiceRole

---
# Note: Secrets devem ser criados via GitHub Actions ou GitOps
# Nunca commitar secrets reais no repositório

# Secrets necessários:
# - keycloak-client-secrets: admin-client-secret, api-client-secret
# - jwt-secrets: issuer
# - database-secrets: keycloak-db-user, keycloak-db-password, postgres-exporter-dsn
