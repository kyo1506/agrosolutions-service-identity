---
# Identity API ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-api-config
  namespace: agrosolutions-identity
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://*:80"
  AllowedHosts: "*"
  
  # JWT Configuration
  Jwt__Authority: "http://keycloak-service:8080/realms/agrosolutions"
  Jwt__Audience: "agrosolutions-api"
  Jwt__ExternalAuthority: "http://keycloak-admin.agrosolutions.site/realms/agrosolutions"
  
  # Keycloak Configuration  
  KeycloakConfiguration__BaseUrl: "http://keycloak-service:8080"
  KeycloakConfiguration__TokenEndpointPath: "/realms/master/protocol/openid-connect/token"
  KeycloakConfiguration__UsersEndpointPath: "/admin/realms/agrosolutions/users"
  KeycloakConfiguration__TargetRealm: "agrosolutions"
  KeycloakConfiguration__Audience: "http://keycloak-service:8080"
  KeycloakConfiguration__AdminClientId: "agrosolutions-api-service-account"
  KeycloakConfiguration__ApiClientId: "agrosolutions-api"

  # OpenTelemetry Configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-service.agrosolutions-observability:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "agrosolutions-identity-api"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,service.version=1.0.0"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"

  # AWS Configuration
  AWS__Region: "sa-east-1"
  AWS__SNS__UserEventsTopic: "arn:aws:sns:sa-east-1:316295889438:agrosolutions-user-events"
  AWS__SNS__EmailNotificationsTopic: "arn:aws:sns:sa-east-1:316295889438:agrosolutions-email-notifications"
  AWS__SQS__IdentityEventsQueue: "https://sqs.sa-east-1.amazonaws.com/316295889438/agrosolutions-identity-events"
  AWS__SES__ConfigurationSet: "agrosolutions-production"
  AWS__SES__FromEmail: "noreply@agrosolutions.com.br"
  AWS__SES__FromName: "AgroSolutions"

---
# Keycloak ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: agrosolutions-identity
data:
  KC_DB: "postgres"
  KC_DB_URL_HOST: "keycloak-db-service"
  KC_DB_URL_DATABASE: "keycloak"
  KC_DB_URL_PORT: "5432"
  KC_DB_USERNAME: "keycloak"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
