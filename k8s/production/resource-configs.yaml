---
# Resource Quotas for Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agrosolutions-identity-quota
  namespace: agrosolutions-identity
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 12Gi
    persistentvolumeclaims: "5"

---
# Limit Ranges for Pods
apiVersion: v1
kind: LimitRange
metadata:
  name: agrosolutions-identity-limits
  namespace: agrosolutions-identity
spec:
  limits:
    - max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: "25m"
        memory: 32Mi
      default:
        cpu: "200m"
        memory: 256Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      type: Container

---
# PodDisruptionBudget for Identity API
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity-api-pdb
  namespace: agrosolutions-identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: identity-api
